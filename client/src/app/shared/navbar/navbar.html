<header class="border-b border-border bg-surface">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8">
    <a
      routerLink="/"
      class="inline-flex items-center gap-3 rounded-lg text-lg font-semibold tracking-tight"
    >
      <span
        class="grid size-10 place-items-center rounded-xl bg-brand-ink text-accent-subtle"
        aria-hidden="true"
      >
        <svg lucideFileText class="size-6" strokeWidth="1.8"></svg>
      </span>
      Certifica<span class="-ml-3 text-brand-strong">+</span>
    </a>

    <span class="flex gap-2">
      @if (sessaoAutenticada(); as sessao) {
        <div class="flex items-center gap-3 sm:gap-5">
          <p class="hidden text-sm text-text-muted sm:block">{{ sessao.usuario.email }}</p>

          <button
            (click)="authService.encerrarSessao()"
            class="inline-flex items-center gap-2 border border-border-strong text-text-subtle px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-surface-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
          >
            <svg lucideUserRoundArrowLeft class="size-4"></svg>
            Sair
          </button>
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          class="inline-flex items-center gap-2 bg-brand text-on-dark px-4 py-2.5 text-sm font-semibold rounded-lg hover:bg-brand-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
        >
          <svg lucideLogIn class="size-4"></svg>
          Entrar</a
        >
      }
    </span>
  </div>
</header>
